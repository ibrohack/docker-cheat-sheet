<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Cheat Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">
<header>
  <h1 class="title">docker <span class="caret">▌</span></h1>
  <p class="tagline">The commands people actually use, grouped by what you are trying to do. Click any line to copy it.</p>

  <div class="controls">
    <div class="searchrow">
      <div class="field">
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="filter: volume, logs, prune, compose…" aria-label="Filter commands">
        <span class="slash">/</span>
      </div>
      <button class="themebtn" id="theme" type="button">Toggle theme</button>
    </div>
    <nav class="jumps" id="jumps" aria-label="Sections"></nav>
  </div>
</header>

<main id="out"></main>
<div class="empty" id="empty" hidden>No results for <code id="qecho"></code></div>

<footer>
  Replace <code>&lt;ct&gt;</code> with the container name or ID, <code>&lt;img&gt;</code> with the image and <code>&lt;vol&gt;</code> with the volume.
  Almost every command accepts <code>--help</code>.
</footer>
</div>

<script src="js/app.js" defer></script>
</body>
</html>
